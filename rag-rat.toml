# AIPM rag-rat-project-docs is qualified against rag-rat 0.23.0+g7dc9ab62c1ed.
[index]
root = "."
database = ".rag-rat/index.sqlite"

[llm.embedding]
model = "BAAI/bge-small-en-v1.5"

[llm.embedding.runtime]
max_embedding_chars = 2000

[[target]]
name = "project-markdown"
language = "markdown"
directories = ["."]
kind = "docs"
include = ["**/*.md"]
exclude = [
  ".agents/**",
  ".codex/**",
  ".git/**",
  ".rag-rat/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "doc/archived-plans/**",
  "doc/rework/**/old-doc/**",
  "doc/rework/**/old-code/**",
]
