interface:
  display_name: "Implementation Planning"
  short_description: "Maintain root doc/plan.md phases."
  default_prompt: "Use $implementation-planning before implementation work to maintain root doc/plan.md as a compact sliding window with one acceptance boundary per phase. Derive concrete tasks, edge cases, verification, and completion review from applicable design authority and engineering rigor without copying durable rigor declarations into the plan; require independent review only when that contract, consequence, weak verification, another authority, or the acceptance plan requires it."
