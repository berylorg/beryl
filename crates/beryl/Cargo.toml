[package]
name = "beryl"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-faults = []

[dependencies]
anyhow.workspace = true
beryl-app.workspace = true
beryl-backend.workspace = true
beryl-home-store.workspace = true
beryl-model.workspace = true
beryl-state.workspace = true
syndic-storage.workspace = true
clap.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
beryl-wsl-supervisor.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
