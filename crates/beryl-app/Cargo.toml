[package]
name = "beryl-app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
test-faults = [
    "beryl-backend/lifecycle-test-support",
    "beryl-home-store/test-faults",
    "beryl-state/test-faults",
    "syndic-storage/test-faults",
]

[dependencies]
beryl-backend.workspace = true
beryl-home-store.workspace = true
beryl-model.workspace = true
beryl-state.workspace = true
beryl-stream.workspace = true
gpui.workspace = true
gpui-scrollbar.workspace = true
gpui-settings-window.workspace = true
gpui-text-input.workspace = true
getrandom.workspace = true
jsonc-parser.workspace = true
gpui_sum_tree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syndic-storage.workspace = true
tempfile.workspace = true
taplo.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
beryl-backend = { workspace = true, features = ["lifecycle-test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tungstenite.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
rodio.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
