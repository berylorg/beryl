[workspace]
members = [
    "crates/beryl",
    "crates/beryl-app",
    "crates/beryl-backend",
    "crates/beryl-home-store",
    "crates/beryl-model",
    "crates/beryl-state",
    "crates/beryl-stream",
    "crates/syndic-storage",
]
resolver = "3"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"

[profile.debugging]
inherits = "dev"
debug = 2
strip = "none"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bounded-json = { path = "../bounded-json" }
beryl-app = { path = "crates/beryl-app" }
beryl-backend = { path = "crates/beryl-backend" }
beryl-home-store = { path = "crates/beryl-home-store" }
beryl-model = { path = "crates/beryl-model" }
beryl-state = { path = "crates/beryl-state" }
beryl-stream = { path = "crates/beryl-stream" }
syndic-storage = { path = "crates/syndic-storage" }
clap = { version = "4.6.1", features = ["derive"] }
fjall = { path = "../fjall-fork", version = "=3.1.6" }
getrandom = "0.4.2"
hex = "0.4.3"
gpui = { git = "https://github.com/berylorg/zed-fork.git", rev = "a674a1550992a04fe6601ebcf06ee3849564d0d1", default-features = false, features = ["windows-manifest"] }
gpui-scrollbar = { git = "https://github.com/berylorg/gpui-scrollbar.git", rev = "ad073c5d033e65251512f4bf19dea1a3814ea066" }
gpui-settings-window = { git = "https://github.com/berylorg/gpui-settings-window.git", rev = "e160b2931ecc05824ac991ad1c4297b6f5c78113" }
gpui-text-input = { git = "https://github.com/berylorg/gpui-text-input.git", rev = "04e0b567afc4f15b61b2b2de65fcbccab2392228" }
gpui_sum_tree = "0.2.2"
image = "0.25.1"
jsonc-parser = { version = "0.32.4", default-features = false }
markdown = { version = "1.0.0", default-features = false }
once_cell = "1.21.4"
regex = "1.12.3"
raw-window-handle = "0.6.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "hound"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
shlex = "1.3.0"
soketto = { version = "0.8.1", default-features = false }
tempfile = "3.27.0"
taplo = { version = "0.14.0", default-features = false }
thiserror = "2.0.18"
toml = "0.9.12"
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
unicode-segmentation = "1.12.0"
unicode-normalization = "=0.1.25"
wait-timeout = "0.2.1"
windows = "0.61"
